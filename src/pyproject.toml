[tool.poetry]
name = "sandbox-prolog-d"
version = "0.1.0"
description = "Web service for running Prolog-D code via HTTP API"
authors = ["Cappa <mig19@mail.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.162.0"
uvicorn = {version = "0.34.2", extras = ["standard"]}
jinja2 = "3.1.6"
gunicorn = "^26.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-mock = "*"
httpx2 = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
