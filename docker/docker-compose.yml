services:

  sandbox-prolog-d:
    build:
      context: ..
      args:
        - SANDBOX_USER_UID=999
        - SANDBOX_DIR=/sandbox
      dockerfile: ./docker/Dockerfile
    container_name: sandbox-prolog-d
    image: sandbox-prolog-d
    volumes:
      - ../src:/app/src
      - import:/sandbox/import:ro
    ports:
      - "9003:9003"
    networks:
      - localhost
    environment:
      - SANDBOX_USER_UID=999
      - SANDBOX_DIR=/sandbox
    restart: on-failure
    command: >
      sh -c "cd /app/src && uvicorn app.main:app
      --host 0.0.0.0 --port 9003 --reload --log-level debug"

networks:
  localhost:
    external: true

volumes:
  import:
    external: true
