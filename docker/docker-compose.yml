services:

  sandbox-prolog-d:
    build:
      context: ..
      args:
        - SANDBOX_USER_UID=999
        - SANDBOX_DIR=/sandbox
      dockerfile: ./docker/Dockerfile
    container_name: sandbox-prolog-d
    image: sandbox-prolog-d
    volumes:
      - ../src:/app/src
      - import:/sandbox/import:ro
    ports:
      - "9003:9003"
    networks:
      - localhost
    environment:
      - SANDBOX_USER_UID=999
      - SANDBOX_DIR=/sandbox
    restart: on-failure
    command: >
      gunicorn app.main:app
      --chdir /app/src
      --bind 0.0.0.0:9003
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --log-level debug
      --timeout 60
      --reload
networks:
  localhost:
    external: true

volumes:
  import:
    external: true
